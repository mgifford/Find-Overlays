[project]
name = "find-overlays"
version = "0.1.0"
description = "Scan websites for accessibility overlay products and report findings."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
]

[dependency-groups]
dev = [
    "flake8",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
