[project]
name = "find-overlays"
version = "0.1.0"
description = "Scan websites for accessibility overlay products and report findings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7.1",
    "requests",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "flake8",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.bandit]
exclude_dirs = [".venv", "tests"]
