name: Queue scan request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  queue:
    name: Add approved URLs to the scan list
    if: >
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'scan-request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate and queue URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/queue_submission.py --issue "$ISSUE_NUMBER"

      - name: Commit queued URLs
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/sites.csv; then
            echo "queued=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add data/sites.csv
          git commit -m "Queue approved scan request [skip ci]"
          git push origin main
          echo "queued=true" >> "$GITHUB_OUTPUT"

      - name: Start the scan
        if: steps.commit.outputs.queued == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run scan-and-publish.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Update labels and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label needs-triage --add-label scan-queued || true
          if [ "${{ steps.commit.outputs.queued }}" = "true" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Queued. The next scan will publish at https://mgifford.github.io/Find-Overlays/."
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Those URLs are already in the scan list."
          fi
