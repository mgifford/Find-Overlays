name: Scan and publish site

on:
  schedule:
    # Weekly on Monday at 05:23 UTC.
    - cron: "23 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "find-overlay.py"
      - "scripts/**"
      - "site/**"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    name: Scan sites and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Scan sites
        run: uv run find-overlay.py data/sites.csv --json scan.json --no-csv

      - name: Build site
        run: uv run python scripts/build_site.py --scan scan.json

      - name: Commit scan results
        run: |
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/index.html
          if git diff --cached --quiet; then
            echo "No scan changes to commit."
          else
            git commit -m "Update scan results [skip ci]"
            git push origin main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
