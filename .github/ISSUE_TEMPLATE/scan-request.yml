name: Scan websites for accessibility overlays
description: >
  Request an automatic scan of up to 100
  publicly accessible websites.
title: "SCAN: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Accessibility overlay scan

        Enter up to 100 public website addresses.

        One address per line.

        Both full URLs and bare domains are supported.

        Examples:
        - example.gov
        - https://example.org/
        - https://example.com/accessibility

        The scan begins automatically when the issue is submitted.

        Results will be posted to this issue and published on GitHub Pages.

        This tool detects references to known accessibility overlay products.
        It does not assess WCAG conformance. Requests and results are public.

  - type: textarea
    id: urls
    attributes:
      label: Site URLs
      description: >
        One public URL or domain per line.
        Maximum 100 distinct addresses.
      placeholder: |
        example.gov
        example.org
        https://example.com/
    validations:
      required: true

  - type: input
    id: organization
    attributes:
      label: Organization or context
      description: Optional description of these sites.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional information about the scan.
